<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageFast</title>

    <!-- Yandex.Metrika counter -->
    <script src="yandex.js" async></script>
    <noscript><div><img src="https://mc.yandex.ru/watch/112737054" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!-- /Yandex.Metrika counter -->

    <link rel="icon" type="image/png" href="ImageFast_logo.png">
    <!-- Подключаем выразительный шрифт для логотипа -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Отдельная верхняя полоса для логотипа -->
    <div class="brand-banner">
        <div class="brand-logo-center">ImageFast</div>
    </div>

    <header class="main-header">
        <div class="header-top">
            <h1 id="header-title" class="header-title">Коллекция изображений </h1>
            <button id="header-back-btn" class="back-btn hidden-view" onclick="switchView('categories')">← Назад</button>
        </div>
        
        <div class="filters" id="filters-container">
            <button class="chip active" onclick="setOrientation(null)">Все</button>
            <button class="chip" onclick="setOrientation('portrait')">Вертикальные</button>
            <button class="chip" onclick="setOrientation('landscape')">Альбомные</button>
        </div>
    </header>

    <main>
        <div id="loader" class="loading">Загрузка каталога...</div>

        <div id="categories-view" class="view-container">
            <div id="categories-grid" class="grid"></div>
        </div>

        <div id="wallpapers-view" class="view-container hidden-view">
            <div id="wallpapers-grid" class="grid"></div>
        </div>
    </main>

    <div id="imageModal" class="modal">
        <button class="back-btn modal-close" onclick="closeImage()">← Назад</button>
        
        <div id="modalLoader" class="modal-loader">
            <div class="spinner"></div>
            <div></div>
        </div>

        <!-- Главное изображение принимает эскиз и принудительные размеры оригинала -->
        <img id="modalImg" src="" alt="Wallpaper">
        
        <div class="modal-nav">
            <button class="nav-circle-btn" onclick="prevImage()" title="Предыдущая">←</button>
            <button class="nav-circle-btn" onclick="nextImage()" title="Следующая">→</button>
        </div>
    </div>

    <script>
        const BASE_DOMAIN = "https://yaaru18058.github.io/QuickImagesCatalog/";
        
        const categoryNameMap = {
            "nature": "Природа",
            "anime": "Аниме",
            "cyberpunk": "Киберпанк",
            "minimalist": "Минимализм",
            "space": "Космос",
            "cars": "Автомобили",
            "cityscape": "Городской пейзаж",
            "dark": "Темные",
            "fantasy": "Фэнтези",
            "abstract": "Абстракция",
            "gaming": "Игры",
            "mountains": "Горы",
            "ocean": "Океан",
            "animals": "Животные",
            "architecture": "Архитектура",
            "retro": "Ретро",
            "sci-fi": "Научная фантастика",
            "sunset": "Закат",
            "neon": "Неон",
            "pixel art": "Пиксель-арт",
            "imported": "Популярные"
        };

        let allWallpapers = [];
        let currentOrientation = null;
        let selectedCategory = null;
        let savedScrollPosition = 0;

        let currentFilteredList = [];
        let currentIndex = 0;

        // --- ФУНКЦИЯ РАНДОМА, ПРИВЯЗАННАЯ КО ДНЮ НЕДЕЛИ ---
        function getDayOfWeekSeed() {
            const now = new Date();
            const year = now.getFullYear();
            const startOfYear = new Date(year, 0, 1);
            const weekNumber = Math.ceil((((now - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
            const dayOfWeek = now.getDay();
            return year * 1000 + weekNumber * 10 + dayOfWeek;
        }

        function createSeededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return function() {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        function seededShuffle(array, seed) {
            const arr = [...array];
            const rnd = createSeededRandom(seed);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rnd() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        // ----------------------------------------------------

        async function init() {
            try {
                const response = await fetch(BASE_DOMAIN + "catalog.json");
                if (!response.ok) throw new Error("Ошибка загрузки сети");
                allWallpapers = await response.json();
                
                document.getElementById('loader').style.display = 'none';
                renderCategories();
            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = '<div class="error">Не удалось загрузить каталог. Проверьте соединение.</div>';
            }
        }

        function setOrientation(orientation) {
            currentOrientation = orientation;
            
            document.querySelectorAll('.filters .chip').forEach(btn => {
                btn.classList.remove('active');
                if ((orientation === null && btn.textContent === 'Все') ||
                    (orientation === 'portrait' && btn.textContent === 'Вертикальные') ||
                    (orientation === 'landscape' && btn.textContent === 'Альбомные')) {
                    btn.classList.add('active');
                }
            });

            if (selectedCategory) {
                renderWallpapersContent(selectedCategory);
            } else {
                renderCategoriesContent();
            }
        }

        function switchView(targetView) {
            const catView = document.getElementById('categories-view');
            const wallView = document.getElementById('wallpapers-view');

            const activeView = (targetView === 'wallpapers') ? catView : wallView;
            activeView.classList.add('fade-out');

            if (targetView === 'wallpapers') {
                savedScrollPosition = window.scrollY;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            setTimeout(() => {
                if (targetView === 'categories') {
                    selectedCategory = null;
                    
                    document.getElementById('header-title').classList.remove('hidden-view');
                    document.getElementById('header-back-btn').classList.add('hidden-view');
                    document.getElementById('filters-container').style.display = 'flex';

                    catView.classList.remove('hidden-view');
                    wallView.classList.add('hidden-view');
                    renderCategoriesContent();

                    window.scrollTo(0, savedScrollPosition);
                } else {
                    document.getElementById('header-title').classList.add('hidden-view');
                    document.getElementById('header-back-btn').classList.remove('hidden-view');
                    document.getElementById('filters-container').style.display = 'none';

                    catView.classList.add('hidden-view');
                    wallView.classList.remove('hidden-view');
                    renderWallpapersContent(selectedCategory);
                }

                catView.classList.remove('fade-out');
                wallView.classList.remove('fade-out');
            }, 200);
        }

        function renderCategories() {
            selectedCategory = null;
            document.getElementById('header-title').classList.remove('hidden-view');
            document.getElementById('header-back-btn').classList.add('hidden-view');
            document.getElementById('filters-container').style.display = 'flex';

            document.getElementById('categories-view').classList.remove('hidden-view');
            document.getElementById('wallpapers-view').classList.add('hidden-view');
            renderCategoriesContent();
        }

        function renderCategoriesContent() {
            const seed = getDayOfWeekSeed();
            
            const uniqueQueries = [...new Set(allWallpapers.map(item => item.category).filter(Boolean))];

            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';

            uniqueQueries.forEach(catQuery => {
                const title = categoryNameMap[catQuery.toLowerCase()] || 
                    (catQuery.charAt(0).toUpperCase() + catQuery.slice(1));

                const matchingItems = allWallpapers.filter(item => 
                    item.category && item.category.toLowerCase() === catQuery.toLowerCase() &&
                    (currentOrientation === null || (item.orientation && item.orientation.toLowerCase() === currentOrientation.toLowerCase()))
                );

                const listToPick = matchingItems.length > 0 ? matchingItems : allWallpapers.filter(item => item.category && item.category.toLowerCase() === catQuery.toLowerCase());
                
                const shuffledItems = seededShuffle(listToPick, seed + catQuery.length);
                const found = shuffledItems[0];

                const pathForPreview = found ? (found.thumb_path || found.path) : '';
                const previewUrl = pathForPreview ? BASE_DOMAIN + pathForPreview : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectCategory(catQuery);
                card.innerHTML = `
                    <img src="${previewUrl}" alt="${title}" loading="lazy">
                    <div class="card-overlay">
                        <div class="card-title">${title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectCategory(categoryQuery) {
            selectedCategory = categoryQuery;
            switchView('wallpapers');
        }

        function renderWallpapersContent(categoryQuery) {
            const grid = document.getElementById('wallpapers-grid');
            grid.innerHTML = '';

            const filtered = allWallpapers.filter(item => {
                const matchesCategory = item.category && item.category.toLowerCase() === categoryQuery.toLowerCase();
                const matchesOrientation = currentOrientation === null || (item.orientation && item.orientation.toLowerCase() === currentOrientation.toLowerCase());
                return matchesCategory && matchesOrientation;
            });

            const seed = getDayOfWeekSeed();
            currentFilteredList = seededShuffle(filtered, seed);

            if (currentFilteredList.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.gridColumn = "1 / -1";
                emptyMsg.style.textAlign = "center";
                emptyMsg.style.color = "var(--text-gray)";
                emptyMsg.style.marginTop = "40px";
                emptyMsg.textContent = "В этой категории пока нет картинок";
                grid.appendChild(emptyMsg);
                return;
            }

            currentFilteredList.forEach((wallpaper, index) => {
                const pathToUse = wallpaper.thumb_path || wallpaper.path;
                const imageUrl = BASE_DOMAIN + pathToUse;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openImageByIndex(index);
                card.innerHTML = `
                    <img src="${imageUrl}" alt="Wallpaper" loading="lazy">
                `;
                grid.appendChild(card);
            });
        }

        function openImageByIndex(index) {
            currentIndex = index;
            const modal = document.getElementById('imageModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            updateModalImage();
        }

        function updateModalImage() {
            if (currentFilteredList.length === 0) return;
            
            const modalImg = document.getElementById('modalImg');
            const modalLoader = document.getElementById('modalLoader');
            
            modalImg.classList.remove('loaded');
            modalLoader.style.opacity = '1';
            modalLoader.style.display = 'flex';

            const wallpaper = currentFilteredList[currentIndex];
            const originalUrl = BASE_DOMAIN + wallpaper.path;
            const thumbToUse = wallpaper.thumb_path || wallpaper.path;

            // Если в объекте каталога случайно уже есть сохраненные размеры, используем их, 
            // иначе запрашиваем картинку в фоне для определения размеров оригинала в пикселях
            if (wallpaper.width && wallpaper.height) {
                modalImg.width = wallpaper.width;
                modalImg.height = wallpaper.height;
            } else {
                // Предзагружаем оригинал «внутренне», чтобы узнать его размеры в пикселях
                const probeImg = new Image();
                probeImg.src = originalUrl;
                probeImg.onload = () => {
                    wallpaper.width = probeImg.naturalWidth;
                    wallpaper.height = probeImg.naturalHeight;
                    // Устанавливаем размер пикселей оригинала на элемент макета
                    modalImg.width = wallpaper.width;
                    modalImg.height = wallpaper.height;
                };
            }

            // Сначала выводим эскиз
            if (thumbToUse) {
                modalImg.src = BASE_DOMAIN + thumbToUse;
            }

            // Полная загрузка оригинала для замены
            const fullImg = new Image();
            fullImg.src = originalUrl;
            fullImg.onload = () => {
                modalImg.src = originalUrl;
                modalImg.classList.add('loaded');
                modalLoader.style.opacity = '0';
                setTimeout(() => {
                    if (modalLoader.style.opacity === '0') {
                        modalLoader.style.display = 'none';
                    }
                }, 300);
            };
        }

        function nextImage() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex + 1) % currentFilteredList.length;
            updateModalImage();
        }

        function prevImage() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
            updateModalImage();
        }

        function closeImage() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('modalImg').src = '';
                document.getElementById('modalImg').removeAttribute('width');
                document.getElementById('modalImg').removeAttribute('height');
                document.getElementById('modalImg').classList.remove('loaded');
            }, 300);
        }

        init();
    </script>
</body>
</html>

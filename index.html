<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageFast — Коллекция качественных обоев и картинок</title>
    <meta id="meta-description" name="description" content="Бесплатные обои для рабочего стола и телефона в высоком разрешении. Огромная коллекция качественных картинок лесов, аниме, авто, космоса и пейзажей.">

    <!-- Динамический тег Canonical для корректной индексации категорий -->
    <link id="canonical-url" rel="canonical" href="https://yaaru18058.github.io/QuickImagesCatalog/">

    <!-- Yandex.Metrika counter -->
    <script src="yandex.js" async></script>
    <noscript><div><img src="https://mc.yandex.ru/watch/112737054" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!-- /Yandex.Metrika counter -->

    <link rel="icon" type="image/png" href="ImageFast_logo.png">
    <!-- Подключаем выразительный шрифт для логотипа -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Отдельная верхняя полоса для логотипа -->
    <div class="brand-banner">
        <div class="brand-logo-center" style="cursor: pointer;" onclick="goHome()">ImageFast</div>
    </div>

    <header class="main-header">
        <div class="header-top">
            <h1 id="header-title" class="header-title">Коллекция изображений</h1>
            <button id="header-back-btn" class="back-btn hidden-view" onclick="goHome()">← Назад</button>
        </div>
        
        <div class="filters" id="filters-container">
            <button class="chip active" onclick="setOrientation(null)">Все</button>
            <button class="chip" onclick="setOrientation('portrait')">Вертикальные</button>
            <button class="chip" onclick="setOrientation('landscape')">Альбомные</button>
        </div>
    </header>

    <main>
        <div id="loader" class="loading">Загрузка каталога...</div>

        <div id="categories-view" class="view-container">
            <div id="categories-grid" class="grid"></div>
        </div>

        <div id="wallpapers-view" class="view-container hidden-view">
            <!-- Блок описания категории -->
            <div id="category-description" class="category-description-box" style="margin-bottom: 20px; line-height: 1.6; color: var(--text-gray, #ccc); font-size: 1.05rem; padding: 0 10px;"></div>
            <div id="wallpapers-grid" class="grid"></div>
        </div>
    </main>

    <!-- Модальное окно с микроразметкой Schema.org -->
    <div id="imageModal" class="modal" itemscope itemtype="http://schema.org/ImageObject">
        <button class="back-btn modal-close" onclick="closeImage()">← Назад</button>
        
        <div id="modalLoader" class="modal-loader">
            <div class="spinner"></div>
            <div></div>
        </div>

        <!-- Главное изображение принимает эскиз и принудительные размеры оригинала -->
        <img id="modalImg" src="" alt="Wallpaper" itemprop="contentUrl">
        <meta itemprop="caption" id="modalCaption" content="Красивые обои для ПК и смартфона">
        
        <div class="modal-nav">
            <button class="nav-circle-btn" onclick="prevImage()" title="Предыдущая">←</button>
            <button class="nav-circle-btn" onclick="nextImage()" title="Следующая">→</button>
        </div>
    </div>

    <script>
        const BASE_DOMAIN = "https://yaaru18058.github.io/QuickImagesCatalog/";
        const DEFAULT_DESCRIPTION = "Бесплатные обои для рабочего стола и телефона в высоком разрешении. Огромная коллекция качественных картинок лесов, аниме, авто, космоса и пейзажей.";
        
        const categoryNameMap = {
            "nature": "Природа",
            "anime": "Аниме",
            "cyberpunk": "Киберпанк",
            "minimalist": "Минимализм",
            "space": "Космос",
            "cars": "Автомобили",
            "cityscape": "Городской пейзаж",
            "dark": "Темные",
            "fantasy": "Фэнтези",
            "abstract": "Абстракция",
            "gaming": "Игры",
            "mountains": "Горы",
            "ocean": "Океан",
            "animals": "Животные",
            "architecture": "Архитектура",
            "retro": "Ретро",
            "sci-fi": "Научная фантастика",
            "sunset": "Закат",
            "neon": "Неон",
            "pixel art": "Пиксель-арт",
            "imported": "Популярные"
        };

        const categoryDescriptions = {
            "nature": "Красивые обои с природой на рабочий стол и телефон. Большая коллекция качественных картинок лесов, гор, рек и пейзажей в высоком разрешении.",
            "anime": "Лучшие аниме обои и картинки для любителей японской анимации. Яркие и атмосферные заставки на экран смартфона или ПК.",
            "cyberpunk": "Атмосферные обои в стиле киберпанк: футуристические города, неон, технологии и ночная эстетика для устройств.",
            "minimalist": "Строгие и стильные минималистичные обои. Ничего лишнего — только чистые цвета и лаконичный дизайн для рабочего стола.",
            "space": "Удивительные космические обои: звезды, галактики, туманности и планеты. Тайны Вселенной на заставках.",
            "cars": "Крутые обои с автомобилями: спорткары, классика и суперкары в высоком качестве для истинных автолюбителей.",
            "cityscape": "Обои с городскими пейзажами и ночными мегаполисами. Архитектура и огни больших городов на экране.",
            "dark": "Темные и готические обои для любителей строгой эстетики и OLED-экранов. Стильные темные заставки.",
            "fantasy": "Сказочные миры, магия и фантастические существа. Коллекция картинок в атмосфере фэнтези.",
            "abstract": "Яркие и необычные абстрактные изображения, узоры и графические текстуры для оригинального оформления экрана.",
            "gaming": "Игровые обои для геймеров: любимые персонажи, арты и кадры из популярных видеоигр.",
            "mountains": "Величественные горные вершины, заснеженные склоны и альпийские пейзажи на заставки.",
            "ocean": "Морские просторы, океанские волны, пляжи и подводный мир для любителей стихии воды.",
            "animals": "Милые и дикие животные в высоком разрешении: качественные фотографии и арты зверей.",
            "architecture": "Удивительные здания, мосты и памятники мировой архитектуры на рабочем столе.",
            "retro": "Винтажные и ретро-обои в стиле прошлых десятилетий для создания особой атмосферы.",
            "sci-fi": "Научная фантастика, футуризм, космические корабли и неизведанные миры.",
            "sunset": "Красивейшие закаты и рассветы: краски неба, солнце и романтическая атмосфера.",
            "neon": "Яркие неоновые подсветки, вывески и кибер-дизайн в темных тонах.",
            "pixel art": "Пиксель-арт обои для ценителей ретро-гейминга и пиксельной графики.",
            "imported": "Популярные и самые скачиваемые обои и заставки для телефонов и ПК."
        };

        let allWallpapers = [];
        let currentOrientation = null;
        let selectedCategory = null;
        let savedScrollPosition = 0;

        let currentFilteredList = [];
        let currentIndex = 0;

        // --- ФУНКЦИЯ РАНДОМА, ПРИВЯЗАННАЯ КО ДНЮ НЕДЕЛИ ---
        function getDayOfWeekSeed() {
            const now = new Date();
            const year = now.getFullYear();
            const startOfYear = new Date(year, 0, 1);
            const weekNumber = Math.ceil((((now - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
            const dayOfWeek = now.getDay();
            return year * 1000 + weekNumber * 10 + dayOfWeek;
        }

        function createSeededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return function() {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        function seededShuffle(array, seed) {
            const arr = [...array];
            const rnd = createSeededRandom(seed);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rnd() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        // ----------------------------------------------------

        async function init() {
            try {
                const response = await fetch(BASE_DOMAIN + "catalog.json");
                if (!response.ok) throw new Error("Ошибка загрузки сети");
                allWallpapers = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                // Проверяем наличие категории в URL при первоначальной загрузке
                const urlParams = new URLSearchParams(window.location.search);
                const categoryParam = urlParams.get('category');

                if (categoryParam) {
                    selectCategory(categoryParam, false);
                } else {
                    renderCategories();
                }
            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = '<div class="error">Не удалось загрузить каталог. Проверьте соединение.</div>';
            }
        }

        // Обработка кнопок Назад/Вперед в браузере
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.category) {
                selectCategory(event.state.category, false);
            } else {
                switchView('categories', false);
            }
        });

        function goHome() {
            if (selectedCategory) {
                switchView('categories', true);
            }
        }

        function setOrientation(orientation) {
            currentOrientation = orientation;
            
            document.querySelectorAll('.filters .chip').forEach(btn => {
                btn.classList.remove('active');
                if ((orientation === null && btn.textContent === 'Все') ||
                    (orientation === 'portrait' && btn.textContent === 'Вертикальные') ||
                    (orientation === 'landscape' && btn.textContent === 'Альбомные')) {
                    btn.classList.add('active');
                }
            });

            if (selectedCategory) {
                renderWallpapersContent(selectedCategory);
            } else {
                renderCategoriesContent();
            }
        }

        function switchView(targetView, pushState = true) {
            const catView = document.getElementById('categories-view');
            const wallView = document.getElementById('wallpapers-view');

            const activeView = (targetView === 'wallpapers') ? catView : wallView;
            activeView.classList.add('fade-out');

            if (targetView === 'wallpapers') {
                savedScrollPosition = window.scrollY;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            setTimeout(() => {
                if (targetView === 'categories') {
                    selectedCategory = null;
                    
                    document.getElementById('header-title').classList.remove('hidden-view');
                    document.getElementById('header-back-btn').classList.add('hidden-view');
                    document.getElementById('filters-container').style.display = 'flex';

                    // Обновляем title, meta description, canonical и URL для главной
                    document.title = "ImageFast — Коллекция качественных обоев и картинок";
                    document.getElementById('meta-description').setAttribute('content', DEFAULT_DESCRIPTION);
                    
                    const canonicalTag = document.getElementById('canonical-url');
                    if (canonicalTag) {
                        canonicalTag.setAttribute('href', BASE_DOMAIN);
                    }

                    if (pushState) {
                        const newUrl = window.location.pathname;
                        history.pushState(null, '', newUrl);
                    }

                    catView.classList.remove('hidden-view');
                    wallView.classList.add('hidden-view');
                    renderCategoriesContent();

                    window.scrollTo(0, savedScrollPosition);
                } else {
                    document.getElementById('header-title').classList.add('hidden-view');
                    document.getElementById('header-back-btn').classList.remove('hidden-view');
                    document.getElementById('filters-container').style.display = 'none';

                    catView.classList.add('hidden-view');
                    wallView.classList.remove('hidden-view');
                    renderWallpapersContent(selectedCategory);
                }

                catView.classList.remove('fade-out');
                wallView.classList.remove('fade-out');
            }, 200);
        }

        function renderCategories() {
            selectedCategory = null;
            document.getElementById('header-title').classList.remove('hidden-view');
            document.getElementById('header-back-btn').classList.add('hidden-view');
            document.getElementById('filters-container').style.display = 'flex';

            document.getElementById('categories-view').classList.remove('hidden-view');
            document.getElementById('wallpapers-view').classList.add('hidden-view');
            
            document.title = "ImageFast — Коллекция качественных обоев и картинок";
            document.getElementById('meta-description').setAttribute('content', DEFAULT_DESCRIPTION);
            
            const canonicalTag = document.getElementById('canonical-url');
            if (canonicalTag) {
                canonicalTag.setAttribute('href', BASE_DOMAIN);
            }

            renderCategoriesContent();
        }

        function renderCategoriesContent() {
            const seed = getDayOfWeekSeed();
            
            const uniqueQueries = [...new Set(allWallpapers.map(item => item.category).filter(Boolean))];

            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';

            uniqueQueries.forEach(catQuery => {
                const catKey = catQuery.toLowerCase();
                const title = categoryNameMap[catKey] || (catQuery.charAt(0).toUpperCase() + catQuery.slice(1));
                const catDesc = categoryDescriptions[catKey] || `Обои и картинки из категории ${title}`;

                const matchingItems = allWallpapers.filter(item => 
                    item.category && item.category.toLowerCase() === catQuery.toLowerCase() &&
                    (currentOrientation === null || (item.orientation && item.orientation.toLowerCase() === currentOrientation.toLowerCase()))
                );

                const listToPick = matchingItems.length > 0 ? matchingItems : allWallpapers.filter(item => item.category && item.category.toLowerCase() === catQuery.toLowerCase());
                
                const shuffledItems = seededShuffle(listToPick, seed + catQuery.length);
                const found = shuffledItems[0];

                const pathForPreview = found ? (found.thumb_path || found.path) : '';
                const previewUrl = pathForPreview ? BASE_DOMAIN + pathForPreview : '';

                const card = document.createElement('div');
                card.className = 'card';
                // Добавляем атрибуты Schema.org для категорий
                card.setAttribute('itemscope', '');
                card.setAttribute('itemtype', 'http://schema.org/ImageObject');
                card.onclick = () => selectCategory(catQuery);
                card.innerHTML = `
                    <img src="${previewUrl}" alt="Категория ${title} — обои и заставки" itemprop="contentUrl" loading="lazy">
                    <meta itemprop="name" content="${title}">
                    <meta itemprop="description" content="${catDesc}">
                    <div class="card-overlay">
                        <div class="card-title">${title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectCategory(categoryQuery, pushState = true) {
            selectedCategory = categoryQuery;
            
            const catKey = categoryQuery.toLowerCase();
            const catTitle = categoryNameMap[catKey] || (catKey.charAt(0).toUpperCase() + catKey.slice(1));
            const catDesc = categoryDescriptions[catKey] || DEFAULT_DESCRIPTION;
            
            // Обновляем тег <title> и <meta description>
            document.title = `${catTitle} — Обои для рабочего стола и телефона | ImageFast`;
            document.getElementById('meta-description').setAttribute('content', catDesc);

            // Обновляем canonical для текущей категории
            const canonicalTag = document.getElementById('canonical-url');
            if (canonicalTag) {
                canonicalTag.setAttribute('href', `${BASE_DOMAIN}?category=${encodeURIComponent(categoryQuery)}`);
            }

            // Обновляем URL без перезагрузки страницы
            if (pushState) {
                const newUrl = `${window.location.pathname}?category=${encodeURIComponent(categoryQuery)}`;
                history.pushState({ category: categoryQuery }, '', newUrl);
            }

            switchView('wallpapers', false);
        }

        function renderWallpapersContent(categoryQuery) {
            const grid = document.getElementById('wallpapers-grid');
            const descContainer = document.getElementById('category-description');
            
            grid.innerHTML = '';

            const catKey = categoryQuery.toLowerCase();
            const catTitle = categoryNameMap[catKey] || (catKey.charAt(0).toUpperCase() + catKey.slice(1));

            // Выводим SEO текстовое описание категории
            if (categoryDescriptions[catKey]) {
                descContainer.innerHTML = `<h2 style="font-size: 1.4rem; color: #fff; margin-bottom: 8px;">${catTitle}</h2><p>${categoryDescriptions[catKey]}</p>`;
                descContainer.style.display = 'block';
            } else {
                descContainer.style.display = 'none';
            }

            const filtered = allWallpapers.filter(item => {
                const matchesCategory = item.category && item.category.toLowerCase() === categoryQuery.toLowerCase();
                const matchesOrientation = currentOrientation === null || (item.orientation && item.orientation.toLowerCase() === currentOrientation.toLowerCase());
                return matchesCategory && matchesOrientation;
            });

            const seed = getDayOfWeekSeed();
            currentFilteredList = seededShuffle(filtered, seed);

            if (currentFilteredList.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.gridColumn = "1 / -1";
                emptyMsg.style.textAlign = "center";
                emptyMsg.style.color = "var(--text-gray)";
                emptyMsg.style.marginTop = "40px";
                emptyMsg.textContent = "В этой категории пока нет картинок";
                grid.appendChild(emptyMsg);
                return;
            }

            currentFilteredList.forEach((wallpaper, index) => {
                const pathToUse = wallpaper.thumb_path || wallpaper.path;
                const imageUrl = BASE_DOMAIN + pathToUse;
                const imgAlt = `Обои ${catTitle} #${index + 1} в высоком разрешении`;

                const card = document.createElement('div');
                card.className = 'card';
                // Микроразметка Schema.org для карточек изображений
                card.setAttribute('itemscope', '');
                card.setAttribute('itemtype', 'http://schema.org/ImageObject');
                card.onclick = () => openImageByIndex(index);
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${imgAlt}" itemprop="contentUrl" loading="lazy">
                    <meta itemprop="name" content="${catTitle} #${index + 1}">
                    <meta itemprop="description" content="${imgAlt}">
                `;
                grid.appendChild(card);
            });
        }

        function openImageByIndex(index) {
            currentIndex = index;
            const modal = document.getElementById('imageModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            updateModalImage();
        }

        function updateModalImage() {
            if (currentFilteredList.length === 0) return;
            
            const modalImg = document.getElementById('modalImg');
            const modalLoader = document.getElementById('modalLoader');
            const modalCaption = document.getElementById('modalCaption');
            
            modalImg.classList.remove('loaded');
            modalLoader.style.opacity = '1';
            modalLoader.style.display = 'flex';

            const wallpaper = currentFilteredList[currentIndex];
            const originalUrl = BASE_DOMAIN + wallpaper.path;
            const thumbToUse = wallpaper.thumb_path || wallpaper.path;

            const catKey = selectedCategory ? selectedCategory.toLowerCase() : '';
            const catTitle = categoryNameMap[catKey] || 'Картинка';
            const imgAltText = `${catTitle} — Качественные обои #${currentIndex + 1}`;
            
            modalImg.alt = imgAltText;
            if (modalCaption) {
                modalCaption.setAttribute('content', imgAltText);
            }

            if (wallpaper.width && wallpaper.height) {
                modalImg.width = wallpaper.width;
                modalImg.height = wallpaper.height;
            } else {
                const probeImg = new Image();
                probeImg.src = originalUrl;
                probeImg.onload = () => {
                    wallpaper.width = probeImg.naturalWidth;
                    wallpaper.height = probeImg.naturalHeight;
                    modalImg.width = wallpaper.width;
                    modalImg.height = wallpaper.height;
                };
            }

            if (thumbToUse) {
                modalImg.src = BASE_DOMAIN + thumbToUse;
            }

            const fullImg = new Image();
            fullImg.src = originalUrl;
            fullImg.onload = () => {
                modalImg.src = originalUrl;
                modalImg.classList.add('loaded');
                modalLoader.style.opacity = '0';
                setTimeout(() => {
                    if (modalLoader.style.opacity === '0') {
                        modalLoader.style.display = 'none';
                    }
                }, 300);
            };
        }

        function nextImage() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex + 1) % currentFilteredList.length;
            updateModalImage();
        }

        function prevImage() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
            updateModalImage();
        }

        function closeImage() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('modalImg').src = '';
                document.getElementById('modalImg').removeAttribute('width');
                document.getElementById('modalImg').removeAttribute('height');
                document.getElementById('modalImg').classList.remove('loaded');
            }, 300);
        }

        init();
    </script>
</body>
</html>
